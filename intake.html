<main><div class="wrap">
<h1>Request a quote</h1>
<p class="lead">Tell him what you need. He’ll follow up to ask for photos and set up a time to look at the job.</p>
<form name="intake" method="POST" action="/thanks" data-netlify="true" netlify-honeypot="bot-field">
<p hidden><label>Leave blank <input name="bot-field"></label></p>
<label>Name <input name="name" autocomplete="name" required></label>
<label>Phone <input type="tel" name="phone" autocomplete="tel" required></label>
<label>Email <input type="email" name="email" autocomplete="email"></label>
<label>Job type <select name="job_type" required><option value="">Choose one</option><option>Welding repair</option><option>Metal fabrication</option><option>Mechanical repair</option><option>Custom commission</option><option>Something else</option></select></label>
<label>Town or city <input name="location"></label>
<label>Describe the job <textarea name="details" rows="6" required></textarea></label>
<label>Best way to reach you <select name="contact_pref"><option>Phone call</option><option>Text</option><option>Email</option></select></label>
<button class="btn" type="submit">Send request</button>
</form>
</div></main>
